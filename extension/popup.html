<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="color-scheme" content="dark" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="popup.css" />
  <title>Quick Download</title>
</head>

<body>
  <header>
    <div class="brand">
      <span class="logo" aria-hidden="true">↓</span>
      <div class="brand-copy">
        <strong>Quick Download</strong>
        <span id="engine" class="engine offline">engine offline</span>
      </div>
    </div>
    <button id="dashboard" class="btn ghost" title="Open the dashboard" aria-label="Open dashboard">
      Dashboard <span class="button-arrow" aria-hidden="true">↗</span>
    </button>
  </header>

  <div id="tools-warning" class="warning" hidden>
    <span class="warning-icon" aria-hidden="true">!</span>
    <div>
      <strong>Download engine is incomplete</strong>
      <span>yt-dlp / ffmpeg are required for HLS, DASH and site pages. Direct files still work.</span>
    </div>
  </div>

  <form id="manual">
    <div class="url-field">
      <span class="url-icon" aria-hidden="true">⌁</span>
      <input id="manual-url" type="url" placeholder="Paste a URL to download…" autocomplete="off" required />
    </div>
    <button class="btn primary" type="submit">Get</button>
  </form>

  <div class="toolbar">
    <div class="tabs" role="tablist" aria-label="Download scope">
      <button class="tab active" data-scope="tab" role="tab" aria-selected="true">This tab</button>
      <button class="tab" data-scope="all" role="tab" aria-selected="false">Everything</button>
    </div>
    <div class="toolbar-actions">
      <button id="refresh" class="btn ghost tiny icon-btn" title="Re-scan the page for thumbnails"
        aria-label="Rescan">↻</button>
      <button id="clear" class="btn ghost tiny">Clear</button>
    </div>
  </div>

  <ul id="list"></ul>

  <p id="empty" class="empty">
    <span class="empty-icon" aria-hidden="true">↓</span>
    <strong>Nothing detected yet</strong>
    <span>Play a video or open an image, then reopen this popup.</span>
  </p>

  <details class="settings">
    <summary>
      <span>Settings</span>
      <span class="summary-arrow" aria-hidden="true">⌄</span>
    </summary>
    <div class="settings-list">
      <label class="row">
        <input type="checkbox" id="set-streams" />
        <span>Sniff HLS / DASH streams</span>
      </label>
      <label class="row">
        <input type="checkbox" id="set-thumbs" />
        <span>Generate thumbnails</span>
      </label>
      <label class="row">
        <input type="checkbox" id="set-intercept" />
        <span>Take over Chrome's own downloads</span>
      </label>
      <label class="row">
        <input type="checkbox" id="set-images" />
        <span>Detect images</span>
      </label>
      <label class="row select-row">
        <span>Ignore images under</span>
        <select id="set-minimage">
          <option value="0">Any size</option>
          <option value="51200">50 KB</option>
          <option value="102400">100 KB</option>
          <option value="512000">500 KB</option>
        </select>
      </label>
    </div>
  </details>

  <template id="item-tpl">
    <li>
      <div class="thumb">
        <img data-thumb alt="" loading="lazy" />
        <span class="fallback" data-fallback></span>
        <span class="badge" data-badge hidden></span>
        <span class="duration" data-duration hidden></span>
      </div>
      <div class="info">
        <p class="name" data-name></p>
        <p class="sub" data-sub></p>
      </div>
      <button class="btn primary tiny" data-download>Download</button>
    </li>
  </template>

  <script src="dist/popup.js" type="module"></script>
</body>

</html>
